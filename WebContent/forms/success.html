<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Submitted</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #e0f7fa, #f0fdf4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      animation: fadeIn 1s ease-in;
    }

    h1 {
      font-size: 36px;
      color: #065f46; /* emerald green tone */
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #334155;
      margin-bottom: 30px;
    }

    a {
      text-decoration: none;
      background-color: #2563eb;
      color: #fff;
      padding: 12px 28px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 16px;
      transition: background 0.3s ease;
    }

    a:hover {
      background-color: #1e40af;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }

      p {
        font-size: 16px;
      }

      a {
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>

  <h1>🎉 Application Submitted!</h1>
  <p>Thank you for applying. Our team will get back to you shortly.</p>
  <a href="studentForm.html">⬅ Back To Form</a>

</body>
</html>
