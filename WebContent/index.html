<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internship Portal</title>
  <link rel="stylesheet" href="/InternshipPortal/css/style.css" />
  <style>
    body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to right, #f8fafc, #e0f2fe); /* soft background */
}

.welcome-box {
  background-color: #ffffff;
  padding: 50px 70px;
  border-radius: 16px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
  text-align: center;
  max-width: 450px;
  width: 90%;
  transition: transform 0.2s ease;
}

.welcome-box:hover {
  transform: translateY(-3px);
}

.welcome-box h1 {
  margin-bottom: 25px;
  font-size: 30px;
  color: #1f2937;
  font-weight: 600;
}

.welcome-box p {
  margin-bottom: 25px;
  font-size: 16px;
  color: #4b5563;
}

.welcome-box a {
  display: inline-block;
  margin-top: 12px;
  padding: 12px 26px;
  background-color: #4f46e5;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: 500;
  font-size: 16px;
  transition: background 0.3s ease, transform 0.2s ease;
}

.welcome-box a:hover {
  background-color: #4338ca;
  transform: scale(1.03);
}
.button-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  margin-top: 20px;
}
  
  </style>
</head>
<body>
  <div class="welcome-box">
  <h1>🎓 Welcome to Internship Portal</h1>
  <p>Please choose an option to get started:</p>

  <div class="button-group">
    <a href="forms/studentForm.html">Apply as Student</a>
    <a href="forms/login.html">Admin Login</a>
  </div>
</div>
  
  
</body>
</html>
